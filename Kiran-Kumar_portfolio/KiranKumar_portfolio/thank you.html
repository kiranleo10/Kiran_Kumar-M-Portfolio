<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Kiran Kumar Portfolio</title>
  <link rel="icon" type="image/png" href="static/Image/portfolio_icon.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1c1c1c;
      color: #00fff7;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, Arial;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 7vw, 3rem);
      margin-bottom: 15px;
    }
    p {
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      color: #cccccc;
      max-width: 500px;
      line-height: 1.6;
    }
    a.btn-home {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 28px;
      background-color: #00fff7;
      color: #1c1c1c;
      text-decoration: none;
      font-weight: bold;
      border-radius: 25px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    a.btn-home:hover {
      background-color: #00e6d2;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <h1>Thank You!</h1>
  <p>Your message has been sent successfully. I will get back to you soon.</p>
  <a href="index.html" class="btn-home">Go back to Home</a>

</body>
</html>
